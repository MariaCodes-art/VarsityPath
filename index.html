<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VarsityPath - Higher Education Pathway Navigator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">VarsityPath</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Institutions</a>
            <a href="#">Pathways</a>
            <a href="#">About</a>
        </nav>
    </header>

    <main>
        <!-- Hero Section -->
        <section id="heroSection" class="hero">
            <h1>Find Your Perfect Higher Education Pathway</h1>
             <h1>MACHETE PETER</h1>
            <p>Explore institutions, courses, and requirements all in one place.</p>
            <button id="exploreBtn">Explore Now</button>
        </section>

        <!-- Institutions Section (Hidden at first) -->
        <section id="institutionsSection" class="institutions hidden">
            <h2>Featured Institutions</h2>
            <div id="institutionsList" class="grid-container">
                <!-- JavaScript will put cards here -->
            </div>
            <button id="backBtn">Back to Home</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 VarsityPath. FNB Hackathon Project.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
